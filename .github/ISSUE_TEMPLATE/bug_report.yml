name: Bug report
description: Something in Fortis doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove keys and customer data from everything you paste. To report a vulnerability, use the security policy instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fortis version
      description: The output of `fortis --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - npm
        - pnpm
        - Yarn
        - Bun
        - pip, pipx or uv
        - Install script
        - Standalone binary
        - Docker image
        - GitHub Action
        - Not applicable (API or dashboard)
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `fortis doctor`
      description: Paste this if your version has the command. Older versions don't.
      render: text
