name: Release VS Code extension

# Publishes the extension when a tag like vscode-v0.1.0 is pushed. See packages/vscode/PUBLISHING.md.
# In this repository both secrets (VSCE_PAT, OVSX_PAT) are required. In a fork, a store without its
# secret is skipped, so the rest can be dry-run.
# Re-running is safe: a version a store already has is skipped, and the run passes once both list it.

on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-security test
      - run: pnpm --filter fortis-security package
      - name: Run the extension in VS Code
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm --filter fortis-security test:editor; else pnpm --filter fortis-security test:editor; fi

  publish:
    needs: test
    runs-on: ubuntu-24.04
    # The Marketplace can take a while to verify a new version.
    timeout-minutes: 45
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check the publishing secrets
        run: |
          missing=""
          [ -n "$VSCE_PAT" ] || missing="$missing VSCE_PAT"
          [ -n "$OVSX_PAT" ] || missing="$missing OVSX_PAT"
          [ -z "$missing" ] && exit 0
          if [ "$GITHUB_REPOSITORY" = "Divine-mercyx/fortis" ]; then
            echo "::error::Missing secret(s):$missing. Add them in Settings > Secrets and variables > Actions, then re-run this workflow. Nothing was published."
            exit 1
          fi
          echo "::warning::Missing secret(s):$missing. The stores they're for are skipped."
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the extension version
        working-directory: packages/vscode
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "vscode-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $VERSION"; exit 1
          fi
      - run: pnpm --filter fortis-security package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fortis-security-vsix
          path: packages/vscode/fortis-security.vsix
          if-no-files-found: error
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/vscode
        run: pnpm exec vsce publish --packagePath fortis-security.vsix --no-dependencies --skip-duplicate
      - name: Create the Open VSX namespace if it's missing
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode
        run: |
          NS=$(node -p "require('./package.json').publisher")
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$NS")
          if [ "$status" = 404 ]; then pnpm exec ovsx create-namespace "$NS" --pat "$OVSX_PAT"; else echo "Namespace $NS: HTTP $status"; fi
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode
        run: pnpm exec ovsx publish fortis-security.vsix --pat "$OVSX_PAT" --skip-duplicate
      - name: Wait for Open VSX to list it
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode
        run: node scripts/check-listing.mjs openvsx 10
      - name: Wait for the VS Code Marketplace to list it
        if: env.VSCE_PAT != ''
        working-directory: packages/vscode
        run: node scripts/check-listing.mjs marketplace 30
