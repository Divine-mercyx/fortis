name: CI

on:
  push:
    branches: [main]
  pull_request:


# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fortis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fortis/web build
      - run: pnpm --filter fortis-watchdog build
      - run: pnpm --filter fortis-watchdog build:binary
      - run: bash packages/cli/scripts/smoke.sh packages/cli/dist-sea/fortis
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project --python 3.12 python packages/python/build_wheel.py --binary packages/cli/dist-sea/fortis --platform manylinux_2_28_x86_64 --version "$(node -p "require('./packages/cli/package.json').version")" --out wheels
      - run: bash packages/python/test_wheel.sh wheels/*.whl
