name: Nightly accuracy

# Things that can change without a commit here: OSV's API, the providers `fortis scan --verify` asks, Gradle's and
# Maven's output (for --resolve), and how the rules behave on real code.
# A scheduled failure opens one issue, and a later pass closes it. See scripts/report-nightly.mjs.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  # Checks changes to this workflow and the live tests. These runs never touch issues. Pull requests that can
  # change what a scan finds, the corpus included, run the corpus check in corpus.yml instead.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - packages/cli/tests/verify-live.test.ts
      - packages/cli/src/rules/resolve.ts
      - packages/cli/tests/resolve-live.test.ts

permissions:
  contents: read

jobs:
  live-osv:
    name: Live OSV tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-watchdog exec vitest run tests/osv-live.test.ts
        env:
          FORTIS_LIVE_OSV: '1'

  live-verify:
    name: Live --verify tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Test-mode keys only. Without them, the checks that need a working or revoked key are skipped.
      - run: pnpm --filter fortis-watchdog exec vitest run tests/verify-live.test.ts
        env:
          FORTIS_LIVE_VERIFY: '1'
          FORTIS_LIVE_PAYSTACK_TEST_KEY: ${{ secrets.FORTIS_LIVE_PAYSTACK_TEST_KEY }}
          FORTIS_LIVE_PAYSTACK_REVOKED_KEY: ${{ secrets.FORTIS_LIVE_PAYSTACK_REVOKED_KEY }}
          FORTIS_LIVE_STRIPE_TEST_KEY: ${{ secrets.FORTIS_LIVE_STRIPE_TEST_KEY }}
          FORTIS_LIVE_STRIPE_REVOKED_KEY: ${{ secrets.FORTIS_LIVE_STRIPE_REVOKED_KEY }}
          FORTIS_LIVE_FLUTTERWAVE_TEST_KEY: ${{ secrets.FORTIS_LIVE_FLUTTERWAVE_TEST_KEY }}
          FORTIS_LIVE_FLUTTERWAVE_REVOKED_KEY: ${{ secrets.FORTIS_LIVE_FLUTTERWAVE_REVOKED_KEY }}

  live-resolve:
    name: Live --resolve tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image has Java, Gradle and Maven.
      - run: java -version && gradle --version && mvn --version
      - run: pnpm --filter fortis-watchdog exec vitest run tests/resolve-live.test.ts
        env:
          FORTIS_LIVE_RESOLVE: '1'

  corpus:
    name: Real-world corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORTIS_CORPUS_DIR: ${{ github.workspace }}/.corpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .corpus
          key: corpus-${{ hashFiles('packages/cli/bench/corpus.json') }}
      - run: pnpm --filter fortis-watchdog corpus

  report:
    name: Open or close the issue
    needs: [live-osv, live-verify, live-resolve, corpus]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ (needs.live-osv.result == 'success' && needs.live-verify.result == 'success' && needs.live-resolve.result == 'success' && needs.corpus.result == 'success') && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Each job's result, so the issue names the ones that failed.
          NEEDS: ${{ toJSON(needs) }}
        run: node packages/cli/scripts/report-nightly.mjs "$RESULT" "$RUN_URL"
