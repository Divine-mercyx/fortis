name: Install and push (e2e)

# The checks a user goes through, on every install method and system: install Fortis, run
# `fortis init`, and push. A key in the first commit of a first push, and a new key later, must be
# blocked; clean code must go through; hooks from earlier versions must be upgraded in place.
# See packages/cli/scripts/e2e.sh. release-cli.yml runs this before publishing.

on:
  pull_request:
  push:
    branches: [main, claude/pensive-hawking-w00waj]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack fortis-watchdog as npm would publish it
        working-directory: packages/cli
        run: |
          mkdir ../../pack
          npm pack --pack-destination ../../pack
          mv ../../pack/fortis-watchdog-*.tgz ../../pack/fortis-watchdog.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: pack/fortis-watchdog.tgz
          if-no-files-found: error

  packages:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        method: [npm, pnpm, yarn1, yarn-pnp, bun, global]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.method }} · ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.method == 'pnpm'
        uses: pnpm/action-setup@v4
      - if: matrix.method == 'bun'
        uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: pack
      - name: git identity
        shell: bash
        run: |
          git config --global user.email e2e@example.com
          git config --global user.name E2E
          git config --global init.defaultBranch main
      - name: e2e
        shell: bash
        run: bash packages/cli/scripts/e2e.sh ${{ matrix.method }} pack/fortis-watchdog.tgz

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: binary and installer · ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-watchdog build:binary
      - name: Lay out a release folder for the installer
        shell: bash
        working-directory: packages/cli/dist-sea
        run: |
          mkdir -p ../release
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path fortis.exe -DestinationPath ../release/fortis-${{ matrix.name }}.zip"
          else
            tar -czf "../release/fortis-${{ matrix.name }}.tar.gz" fortis
          fi
          cd ../release
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
      - name: git identity
        shell: bash
        run: |
          git config --global user.email e2e@example.com
          git config --global user.name E2E
          git config --global init.defaultBranch main
      - name: e2e (binary)
        shell: bash
        run: |
          EXE=packages/cli/dist-sea/fortis
          [ "$RUNNER_OS" = "Windows" ] && EXE=$EXE.exe
          bash packages/cli/scripts/e2e.sh binary "$EXE"
      - name: e2e (install script)
        shell: bash
        run: bash packages/cli/scripts/e2e.sh installer packages/cli/release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-watchdog build:binary
      - name: Build the image as the release does
        working-directory: packages/cli
        run: |
          mkdir -p bin/amd64 && cp dist-sea/fortis bin/amd64/fortis
          docker build --build-arg TARGETARCH=amd64 -t fortis-e2e .
      - name: The image blocks a key and passes clean code
        run: |
          set -euo pipefail
          work=$(mktemp -d) && cd "$work"
          git init -q -b main && git config user.email e2e@example.com && git config user.name E2E
          KEY="AKIA$(printf 'ABCD2345%.0s' 1 2)"
          echo "export const key = '$KEY';" > config.js && git add -A && git commit -qm key
          if docker run --rm -v "$PWD:/src" -w /src -e FORTIS_API_URL=http://127.0.0.1:9 fortis-e2e fortis scan --ci --no-upload; then
            echo 'FAILED: the image did not block a key'; exit 1
          fi
          echo 'export const key = process.env.KEY;' > config.js && git add -A && git commit -qm fix
          docker run --rm -v "$PWD:/src" -w /src -e FORTIS_API_URL=http://127.0.0.1:9 fortis-e2e fortis scan --ci --no-upload
