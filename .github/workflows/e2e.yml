name: Install and push (e2e)

# The checks a user goes through, on every install method and system: install Fortis, run
# `fortis init`, and push. A key in the first commit of a first push, and a new key later, must be
# blocked; clean code must go through; hooks from earlier versions must be upgraded in place.
# See packages/cli/scripts/e2e.sh. release-cli.yml runs this before publishing.

on:
  pull_request:
  push:
    branches: [main, claude/pensive-hawking-w00waj]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack fortis-watchdog as npm would publish it
        working-directory: packages/cli
        run: |
          mkdir ../../pack
          npm pack --pack-destination ../../pack
          mv ../../pack/fortis-watchdog-*.tgz ../../pack/fortis-watchdog.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: pack/fortis-watchdog.tgz
          if-no-files-found: error

  packages:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        method: [npm, pnpm, yarn1, yarn-pnp, bun, global]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.method }} · ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.method == 'pnpm'
        uses: pnpm/action-setup@v4
      - if: matrix.method == 'bun'
        uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: pack
      - name: git identity
        shell: bash
        run: |
          git config --global user.email e2e@example.com
          git config --global user.name E2E
          git config --global init.defaultBranch main
      - name: e2e
        shell: bash
        run: bash packages/cli/scripts/e2e.sh ${{ matrix.method }} pack/fortis-watchdog.tgz

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: binary and installer · ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-watchdog build:binary
      - name: Lay out a release folder for the installer
        shell: bash
        working-directory: packages/cli/dist-sea
        run: |
          mkdir -p ../release
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path fortis.exe -DestinationPath ../release/fortis-${{ matrix.name }}.zip"
          else
            tar -czf "../release/fortis-${{ matrix.name }}.tar.gz" fortis
          fi
          cd ../release
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
      - name: git identity
        shell: bash
        run: |
          git config --global user.email e2e@example.com
          git config --global user.name E2E
          git config --global init.defaultBranch main
      - name: e2e (binary)
        shell: bash
        run: |
          EXE=packages/cli/dist-sea/fortis
          [ "$RUNNER_OS" = "Windows" ] && EXE=$EXE.exe
          bash packages/cli/scripts/e2e.sh binary "$EXE"
      - name: e2e (install script)
        shell: bash
        run: bash packages/cli/scripts/e2e.sh installer packages/cli/release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-watchdog build:binary
      - name: Build the image as the release does
        working-directory: packages/cli
        run: |
          mkdir -p bin/amd64 && cp dist-sea/fortis bin/amd64/fortis
          docker build --build-arg TARGETARCH=amd64 -t fortis-e2e .
      - name: The image blocks a key and passes clean code
        run: |
          set -euo pipefail
          work=$(mktemp -d) && cd "$work"
          git init -q -b main && git config user.email e2e@example.com && git config user.name E2E
          KEY="AKIA$(printf 'ABCD2345%.0s' 1 2)"
          echo "export const key = '$KEY';" > config.js && git add -A && git commit -qm key
          if docker run --rm -v "$PWD:/src" -w /src -e FORTIS_API_URL=http://127.0.0.1:9 fortis-e2e fortis scan --ci --no-upload; then
            echo 'FAILED: the image did not block a key'; exit 1
          fi
          echo 'export const key = process.env.KEY;' > config.js && git add -A && git commit -qm fix
          docker run --rm -v "$PWD:/src" -w /src -e FORTIS_API_URL=http://127.0.0.1:9 fortis-e2e fortis scan --ci --no-upload

  windows-shells:
    needs: pack
    runs-on: windows-latest
    name: PowerShell and cmd · windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: pack
      - name: e2e from PowerShell and cmd
        shell: pwsh
        run: ./packages/cli/scripts/e2e.ps1 pack/fortis-watchdog.tgz

  baseline:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    name: baseline · ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: pack
      - shell: bash
        run: bash packages/cli/scripts/baseline-parity.sh pack/fortis-watchdog.tgz "fingerprints-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-${{ matrix.os }}
          path: fingerprints-${{ matrix.os }}.txt

  baseline-parity:
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fingerprints-*
          merge-multiple: true
      - name: Windows, macOS and Linux write the same baseline
        run: |
          ls fingerprints-*.txt
          [ -s fingerprints-ubuntu-latest.txt ] || { echo 'no fingerprints from Linux'; exit 1; }
          for f in fingerprints-macos-15.txt fingerprints-windows-latest.txt; do
            diff -u fingerprints-ubuntu-latest.txt "$f" || { echo "FAILED: $f differs from Linux"; exit 1; }
          done
          echo "identical: $(wc -l < fingerprints-ubuntu-latest.txt) fingerprints"

  large-repo:
    runs-on: ubuntu-latest
    name: 100,000-file scan under 30 s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fortis-watchdog build
      - name: Generate a 100,000-file repository
        run: node packages/cli/scripts/gen-large-repo.mjs "$RUNNER_TEMP/large" 100000
      - name: Full scan (secrets and dependencies) within the budget
        working-directory: ${{ runner.temp }}/large
        run: |
          set +e
          start=$(date +%s%N)
          node "$GITHUB_WORKSPACE/packages/cli/dist/fortis.js" scan --offline --no-upload > out.txt 2>&1
          code=$?
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          head -3 out.txt
          echo "took ${ms} ms"
          echo "### 100,000-file scan: ${ms} ms" >> "$GITHUB_STEP_SUMMARY"
          # The generator plants 5 AWS-format keys; the scan must find them all (and so fail with 1).
          [ "$code" = 1 ] || { echo "FAILED: expected exit 1 (keys found), got $code"; cat out.txt; exit 1; }
          [ "$(grep -c 'CRITICAL SEC-GEN-001' out.txt)" = 5 ] || { echo 'FAILED: did not find the 5 planted keys'; cat out.txt; exit 1; }
          grep -q '100000 files' out.txt || { echo 'FAILED: did not scan every file'; exit 1; }
          [ "$ms" -lt 30000 ] || { echo "FAILED: ${ms} ms is over the 30 s target"; exit 1; }
