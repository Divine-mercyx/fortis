services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432" # @hit
  redis:
    image: redis:7
    ports:
      - "6379:6379" # @hit
  mongo:
    image: mongo:7
    ports:
      - "27017:27017" # @hit
  mysql:
    image: mysql:8
    ports:
      - "3306:3306" # @hit
  elastic:
    image: elasticsearch:8.15.0
    ports:
      - "9200:9200" # @hit
  rabbit:
    image: rabbitmq:3-management
    ports:
      - "15672:15672" # @hit
  api:
    image: ghcr.io/nolt/api:1.4.2
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgres://api@postgres:5432/core
  cache-local:
    image: redis:7
    ports:
      - "127.0.0.1:6380:6379"
