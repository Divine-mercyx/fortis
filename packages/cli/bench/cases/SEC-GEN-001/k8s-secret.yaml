apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: info
  FEATURE_FLAGS: '{{PLAIN_TEXT_B64}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: app-db
type: Opaque
data:
  username: {{K8S_USER_B64}}
  host: {{K8S_HOST_B64}}
  password: {{K8S_PASSWORD_B64}} # @hit
  DATABASE_URL: {{PG_URL_B64}} # @hit
stringData:
  API_TOKEN: {{GH_TOKEN}} # @hit
  region: eu-west-1
---
apiVersion: v1
kind: Secret
metadata:
  name: app-tls
type: kubernetes.io/tls
data:
  tls.crt: {{PLAIN_TEXT_B64}}
  tls.key: {{PEM_B64}} # @hit
